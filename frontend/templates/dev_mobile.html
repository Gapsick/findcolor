<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Color Hunt 모바일 미리보기</title>
<style>
  body { margin: 0; background: #14161f; color: #fff; font-family: system-ui, sans-serif; display: flex; height: 100vh; }
  .panel { width: 260px; padding: 16px; overflow-y: auto; border-right: 2px solid #333; }
  .panel h2 { font-size: 14px; color: #ffc93c; margin: 18px 0 8px; }
  .panel button {
    display: block; width: 100%; margin-bottom: 6px; padding: 10px;
    background: #262b46; color: #fff; border: 1px solid #444; border-radius: 8px;
    cursor: pointer; text-align: left; font-size: 13px;
  }
  .panel button:hover { background: #33395c; }
  .panel button.active { background: #ffc93c; color: #000; font-weight: bold; }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; background: #0a0b10; }
  .phone {
    /* 노치를 콘텐츠 위에 겹치는 장식이 아니라 별도 칸으로 분리해서
       실제 페이지 내용을 절대 가리지 않게 한다 (겹침 착시 방지) */
    width: 390px; height: 844px; border-radius: 46px; border: 10px solid #111;
    box-shadow: 0 0 0 3px #444, 0 20px 60px rgba(0,0,0,.6);
    overflow: hidden; background: #000;
    display: flex; flex-direction: column;
  }
  .phone-notch-bar { flex: 0 0 30px; display: flex; align-items: center; justify-content: center; background: #000; }
  .phone-notch-bar .pill { width: 110px; height: 16px; background: #111; border-radius: 16px; }
  .phone iframe { flex: 1 1 auto; width: 100%; border: 0; display: block; }
</style>
</head>
<body>
  <div class="panel">
    <h2>참가자 화면</h2>
    <button data-url="/dev/join">메인 (입장)</button>
    <button data-url="/dev/waiting">대기방</button>
    <button data-url="/dev/play">게임 화면</button>
    <button data-url="/dev/leaderboard">결과 (라운드)</button>
    <button data-url="/dev/leaderboard-final-waiting">결과 (최종·발표전)</button>
    <button data-url="/dev/leaderboard-final-revealed">결과 (최종·발표후)</button>
    <h2>방장 화면</h2>
    <button data-url="/dev/admin-login">로그인 화면</button>
    <button data-url="/dev/admin-waiting">대기 뷰</button>
    <button data-url="/dev/admin-playing">진행 뷰</button>
    <button data-url="/dev/admin-result">결과 뷰 (라운드)</button>
    <button data-url="/dev/admin-result-final">결과 뷰 (최종)</button>
  </div>
  <div class="stage">
    <div class="phone">
      <div class="phone-notch-bar"><div class="pill"></div></div>
      <iframe id="frame" src="/dev/join"></iframe>
    </div>
  </div>
<script>
  const frame = document.querySelector("#frame");
  document.querySelectorAll(".panel button").forEach((button) => {
    button.addEventListener("click", () => {
      document.querySelectorAll(".panel button").forEach((b) => b.classList.remove("active"));
      button.classList.add("active");
      frame.src = button.dataset.url;
    });
  });
  document.querySelector('[data-url="/dev/join"]').classList.add("active");
</script>
</body>
</html>
